  <text x="72" y="169" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" letter-spacing="-2" fill="#F3F7FF">MIKE'S</text>
  <text x="72" y="241" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" letter-spacing="-2" fill="#9DCBFF">BASECAMP</text>
  <rect x="73" y="257" width="474" height="3" rx="1.5" fill="url(#line)" opacity=".75"/>
  <text x="73" y="296" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#E7EAF6">a developer with too many side quests.</text>
  <text x="73" y="329" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#AABBD5">web apps  /  AI companions  /  little worlds</text>
  <rect x="73" y="360" width="257" height="39" rx="8" fill="#1E354F" stroke="#4478A2" stroke-opacity=".7"/>
  <text x="92" y="386" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="1" fill="#94D9FF">&gt; BUILD · PLAY · REPEAT_</text>
