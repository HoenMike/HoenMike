<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Mike's Basecamp — build, play, repeat</title>
  <desc id="desc">An original night-blue anime-inspired developer workspace banner with neon accents, a hooded coder, a cat, and a city skyline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A1426"/><stop offset=".58" stop-color="#101B34"/><stop offset="1" stop-color="#1D2144"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1D2C61"/><stop offset="1" stop-color="#0E1730"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142B43"/><stop offset="1" stop-color="#0C1E31"/></linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4679BD"/><stop offset="1" stop-color="#283C75"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7EC9F7"/><stop offset="1" stop-color="#B3A7FF"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#72B6E3" stop-opacity=".26"/><stop offset="1" stop-color="#72B6E3" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#93A6CC" opacity=".13"/></pattern>
    <clipPath id="art"><rect x="846" y="43" width="506" height="372" rx="20"/></clipPath>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="1400" height="460" rx="27" fill="url(#bg)"/>
  <rect width="1400" height="460" rx="27" fill="url(#dots)"/>
