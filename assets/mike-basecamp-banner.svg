  <path d="M0 446h1400" stroke="url(#line)" stroke-width="5" opacity=".75"/>
  <rect x="72" y="72" width="228" height="31" rx="15.5" fill="#1C3555" stroke="#426E9A"/>
  <circle cx="93" cy="88" r="5" fill="#76DDB3"/>
